<?xml version="1.0" encoding="UTF-8"?>
<!-- Creative hub sprite — PLACEHOLDER ART ONLY.

     Nils draws the real mascot himself (docs/creative-hub-plan.md §7). Until then these shapes keep
     the layout honest: a pixel sun, a pixel cloud, a sparkle, a heart, a star and a small blob that
     stands in for the mascot. Every symbol is drawn on a whole-pixel grid with `shape-rendering:
     crispEdges`, so it renders cleanly at any whole-number scale (`image-rendering: pixelated`).

     Use from a hub page or the preview page with a same-origin reference:
       <svg class="sm-icon" width="24" height="24" aria-hidden="true" focusable="false">
         <use href="/design/summer-sprites.svg#sm-cloud"></use>
       </svg>
     Colour comes from `currentColor`, so a symbol follows the theme. The mascot's eyes and mouth are
     punched out with an internal mask instead of a second colour: an external sprite file cannot be
     styled by the host document's CSS, so a cut-out is the only colour-neutral way to keep its face
     readable in both themes.

     NOT for the Minecraft surface: this file is loaded by hub pages only. -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <mask id="sm-mascot-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect x="0" y="0" width="16" height="16" fill="#ffffff" />
      <rect x="6" y="6" width="1" height="2" fill="#000000" />
      <rect x="9" y="6" width="1" height="2" fill="#000000" />
      <rect x="7" y="9" width="2" height="1" fill="#000000" />
    </mask>
  </defs>

  <symbol id="sm-sun" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <g fill="currentColor">
      <rect x="5" y="5" width="6" height="6" />
      <rect x="7" y="1" width="2" height="3" />
      <rect x="7" y="12" width="2" height="3" />
      <rect x="1" y="7" width="3" height="2" />
      <rect x="12" y="7" width="3" height="2" />
      <rect x="2" y="2" width="2" height="2" />
      <rect x="12" y="2" width="2" height="2" />
      <rect x="2" y="12" width="2" height="2" />
      <rect x="12" y="12" width="2" height="2" />
    </g>
  </symbol>

  <symbol id="sm-cloud" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <g fill="currentColor">
      <rect x="3" y="5" width="10" height="6" />
      <rect x="5" y="3" width="4" height="2" />
      <rect x="9" y="4" width="3" height="1" />
      <rect x="2" y="7" width="1" height="3" />
      <rect x="13" y="7" width="1" height="3" />
    </g>
  </symbol>

  <symbol id="sm-sparkle" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <g fill="currentColor">
      <rect x="7" y="2" width="2" height="12" />
      <rect x="2" y="7" width="12" height="2" />
      <rect x="5" y="5" width="2" height="2" />
      <rect x="9" y="5" width="2" height="2" />
      <rect x="5" y="9" width="2" height="2" />
      <rect x="9" y="9" width="2" height="2" />
    </g>
  </symbol>

  <symbol id="sm-heart" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <g fill="currentColor">
      <rect x="2" y="3" width="4" height="3" />
      <rect x="10" y="3" width="4" height="3" />
      <rect x="2" y="6" width="12" height="3" />
      <rect x="4" y="9" width="8" height="2" />
      <rect x="6" y="11" width="4" height="2" />
      <rect x="7" y="13" width="2" height="1" />
    </g>
  </symbol>

  <symbol id="sm-star" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <g fill="currentColor">
      <rect x="7" y="1" width="2" height="3" />
      <rect x="6" y="4" width="4" height="2" />
      <rect x="1" y="6" width="14" height="2" />
      <rect x="2" y="8" width="12" height="2" />
      <rect x="2" y="10" width="5" height="2" />
      <rect x="9" y="10" width="5" height="2" />
      <rect x="2" y="12" width="3" height="2" />
      <rect x="11" y="12" width="3" height="2" />
    </g>
  </symbol>

  <!-- Mascot stand-in: a 16x16 blob with ears and a cut-out face. Replace with Nils' drawing. -->
  <symbol id="sm-mascot-placeholder" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <g fill="currentColor" mask="url(#sm-mascot-hole)">
      <rect x="4" y="4" width="8" height="8" />
      <rect x="3" y="2" width="2" height="3" />
      <rect x="11" y="2" width="2" height="3" />
      <rect x="5" y="12" width="2" height="1" />
      <rect x="9" y="12" width="2" height="1" />
    </g>
  </symbol>
</svg>
