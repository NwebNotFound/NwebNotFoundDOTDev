name: e2e
on:
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright-Browser-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.64.1-chromium
      - name: Playwright installieren
        run: pip install playwright==1.64.1 && python -m playwright install --with-deps chromium
      - name: Install wrangler
        run: npm i -g wrangler
      - name: Icon-Referenzcheck
        run: node scripts/icon-check.mjs
      - name: Asset cache check
        run: node scripts/asset-cache-check.mjs
      - name: Kontrast-Gate (WCAG AA)
        run: node scripts/contrast-check.mjs
      - name: Summer-CSS-Scope-Check
        run: node scripts/summer-scope-check.mjs
      - name: Skin-Lookup gegen echte lokale D1
        run: node scripts/skin-sql.mjs
      - name: e2e
        env:
          E2E_SCREENS_DIR: ${{ runner.temp }}/screens/qa
        run: node scripts/e2e.mjs
